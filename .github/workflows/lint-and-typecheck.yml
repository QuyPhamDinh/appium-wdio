name: Lint and Typecheck

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    lint-and-typecheck:
        name: Lint and TypeScript check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - name: Run ESLint
              run: npm run lint
            - name: Run TypeScript typecheck
              run: npm run typecheck
