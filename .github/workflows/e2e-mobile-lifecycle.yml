name: Mobile Lifecycle Tests

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    android:
        name: Android lifecycle
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            ANDROID_DEVICE_NAME: Pixel 7 Pro
            ANDROID_PLATFORM_VERSION: '15.0'
            ANDROID_UDID: emulator-5554
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci

            - name: Download Android demo app
              run: |
                  mkdir -p apps
                  curl --fail --silent --show-error --location \
                    https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk \
                    --output apps/android.wdio.native.app.v2.2.0.apk

            - name: Enable KVM access
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run Android lifecycle scenarios
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  profile: pixel_7_pro
                  disable-animations: true
                  script: npm run android.app.cucumber -- --spec tests/features/warm_resume.feature

            - name: Upload Android failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: android-lifecycle-diagnostics
                  path: |
                      logs/
                      allure-results/

    ios:
        name: iOS lifecycle
        runs-on: macos-15
        timeout-minutes: 30
        env:
            DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
            IOS_DEVICE_NAME: iPhone 16 Pro
            IOS_PLATFORM_VERSION: '18.5'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci

            - name: Download iOS simulator demo app
              run: |
                  mkdir -p apps
                  curl --fail --silent --show-error --location \
                    https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/ios.simulator.wdio.native.app.v2.2.0.zip \
                    --output "$RUNNER_TEMP/wdio-ios.zip"
                  ditto -x -k "$RUNNER_TEMP/wdio-ios.zip" apps
                  test -d apps/wdiodemoapp.app

            - name: Boot iOS simulator
              run: bash scripts/boot-ios-ci-simulator.sh

            - name: Get Xcode build version
              id: xcode
              run: |
                  xcode_version=$(xcodebuild -version)
                  xcode_build=$(awk '/^Build version / { print $3 }' <<< "$xcode_version")
                  test -n "$xcode_build"
                  printf 'build=%s\n' "$xcode_build" >> "$GITHUB_OUTPUT"

            - name: Restore WebDriverAgent cache
              id: wda-cache
              uses: actions/cache/restore@v6
              with:
                  path: ${{ runner.temp }}/wda-derived-data
                  key: wda-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.build }}-ios${{ env.IOS_PLATFORM_VERSION }}-${{ hashFiles('package-lock.json', 'scripts/build-ios-ci-wda.sh') }}

            - name: Build WebDriverAgent
              run: bash scripts/build-ios-ci-wda.sh

            - name: Save WebDriverAgent cache
              if: success() && steps.wda-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ${{ runner.temp }}/wda-derived-data
                  key: ${{ steps.wda-cache.outputs.cache-primary-key }}

            - name: Warm up iOS simulator
              timeout-minutes: 8
              shell: bash
              run: |
                  mkdir -p logs
                  {
                      echo 'Installing the demo app'
                      time xcrun simctl install "$IOS_UDID" apps/wdiodemoapp.app
                      echo 'Launching the demo app'
                      time xcrun simctl launch "$IOS_UDID" org.wdiodemoapp
                      echo 'Terminating the demo app'
                      time xcrun simctl terminate "$IOS_UDID" org.wdiodemoapp
                  } 2>&1 | tee logs/ios-simulator-warm-up.log

            - name: Run iOS lifecycle scenarios
              env:
                  IOS_APP_PREINSTALLED: 'true'
              run: npm run ios.app.cucumber -- --spec tests/features/warm_resume.feature

            - name: Collect iOS simulator logs
              if: failure()
              run: |
                  simulator_logs="$HOME/Library/Logs/CoreSimulator"
                  if [[ -d "$simulator_logs" ]]; then
                      mkdir -p logs/core-simulator
                      find "$simulator_logs" -maxdepth 1 -type f -name '*.log' -exec cp {} logs/core-simulator/ \;
                      if [[ -n "${IOS_UDID:-}" && -d "$simulator_logs/$IOS_UDID" ]]; then
                          cp -R "$simulator_logs/$IOS_UDID" logs/core-simulator/
                      fi
                  fi

            - name: Upload iOS failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: ios-lifecycle-diagnostics
                  path: |
                      logs/
                      allure-results/
