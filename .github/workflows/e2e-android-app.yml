name: Functional Android App Tests

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    android-app:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            ANDROID_DEVICE_NAME: Pixel 7 Pro
            ANDROID_PLATFORM_VERSION: '15.0'
            ANDROID_UDID: emulator-5554
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci

            - name: Download Android demo app
              run: |
                  mkdir -p apps
                  curl --fail --silent --show-error --location \
                    https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk \
                    --output apps/android.wdio.native.app.v2.2.0.apk

            - name: Enable KVM access
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run Android app tests
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  profile: pixel_7_pro
                  disable-animations: true
                  script: npm run android.app

            - name: Upload Android test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: android-test-reports
                  path: |
                      junit-results/
                      allure-results/
                  if-no-files-found: warn
